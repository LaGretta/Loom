server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the shell / service worker
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js       { add_header Cache-Control "no-cache"; }

    # Long-cache hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Docker's embedded DNS. Using a variable in proxy_pass forces runtime resolution,
    # so nginx still starts (and returns 502 for /api) even if the api container is down —
    # instead of refusing to boot with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse-proxy the API (same-origin => no CORS needed on the backend)
    location /api/ {
        set $loom_api http://api:8080;
        proxy_pass         $loom_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Reverse-proxy the SignalR hub (WebSocket upgrade)
    location /hubs/ {
        set $loom_hub http://api:8080;
        proxy_pass         $loom_hub;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
    }
}
